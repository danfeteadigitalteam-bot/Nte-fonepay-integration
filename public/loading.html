<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment – Nepal Tea Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --tea-green:      #3B6D11;
            --tea-green-mid:  #639922;
            --tea-green-pale: #EAF3DE;
            --tea-green-soft: #C0DD97;
            --cream:          #FAF7F2;
            --bark:           #5C3D1E;
            --mist:           #7A7A6E;
            --border:         #D9D5CB;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--cream);
            background-image:
                radial-gradient(ellipse 70% 50% at 50% -10%, rgba(99,153,34,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 100% 100%, rgba(59,109,17,0.08) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 52px 44px 44px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Logo area ── */
        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 36px;
        }

        .leaf-icon {
            width: auto;
            height: 80px;
            object-fit: contain;
        }

        .brand-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--bark);
            letter-spacing: 0.04em;
            line-height: 1;
        }

        .brand-sub {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--mist);
            margin-top: 3px;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider-leaf {
            color: var(--tea-green-mid);
            font-size: 14px;
            opacity: 0.7;
        }

        /* ── Spinner ── */
        .spinner-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
        }

        .spinner-track {
            position: relative;
            width: 56px;
            height: 56px;
        }

        .spinner-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2.5px solid var(--tea-green-pale);
            border-top-color: var(--tea-green);
            animation: spin 1.1s linear infinite;
        }

        .spinner-inner-dot {
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            background: var(--tea-green-pale);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner-inner-dot::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--tea-green);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.4; transform: scale(0.85); }
            50%       { opacity: 1;   transform: scale(1.1); }
        }

        /* ── Text ── */
        .heading {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 26px;
            font-weight: 500;
            color: var(--bark);
            margin-bottom: 10px;
            letter-spacing: 0.01em;
        }

        .sub {
            font-size: 14px;
            color: var(--mist);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .dots span {
            display: inline-block;
            animation: blink 1.5s infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.25s; }
        .dots span:nth-child(3) { animation-delay: 0.5s; }

        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; }
            30%           { opacity: 1; }
        }

        /* ── Status pill ── */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--tea-green-pale);
            color: var(--tea-green);
            border-radius: 999px;
            padding: 7px 16px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--tea-green);
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        /* ── Footer note ── */
        .footer-note {
            font-size: 11px;
            color: #B0ADA5;
            margin-top: 20px;
            letter-spacing: 0.03em;
        }

        .fonepay-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 14px;
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 11px;
            color: var(--mist);
            letter-spacing: 0.04em;
        }

        .fonepay-badge strong {
            font-weight: 500;
            color: #4A3D8F;
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- Logo -->
        <div class="logo-wrap">
            <img src="./logo.png" alt="Nepal Tea Exchange Logo" class="leaf-icon">
            <div>
                <div class="brand-name">Nepal Tea Exchange</div>
                <div class="brand-sub">Discover the True Tea Experience</div>
            </div>
        </div>

        <!-- Divider -->
        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-leaf">✦</span>
            <div class="divider-line"></div>
        </div>

        <!-- Spinner -->
        <div class="spinner-wrap">
            <div class="spinner-track">
                <div class="spinner-ring"></div>
                <div class="spinner-inner-dot"></div>
            </div>
        </div>

        <!-- Heading -->
        <h1 class="heading">Preparing your QR code</h1>

        <p class="sub">
            Your payment QR is generating<span class="dots"><span>.</span><span>.</span><span>.</span></span><br>
            This will only take a moment.
        </p>

        <!-- Status pill -->
        <div class="status-pill">
            <div class="status-dot"></div>
            Initializing payment terminal
        </div>

        <!-- Footer -->
        <p class="footer-note">Secured &amp; powered by</p>
        <div class="fonepay-badge">
            <strong>fonepay</strong>
        </div>

    </div>

    <script>
        // Auto-refresh every 3 seconds to check if the app is ready
        setTimeout(() => {
            window.location.reload();
        }, 3000);
    </script>

</body>
</html>
